  "n": 5,
  "url": "https://mcbank.co.kr/seller/read.html?sno=27661",
  "src": "엠씨뱅크",
  "date": "10/26",
  "stock": true
 }
];
  }
  renderVals() {
    const base = this.props.baseSize ?? 18;
    const large = this.state.large;
    const on = { bg: '#FFFFFF', fg: '#12263F' };
    const off = { bg: 'transparent', fg: '#FFFFFF' };
    const KIND = [
      ['머시닝센터', /머시닝|LCV|MCT/],
      ['선반', /선반/],
      ['밀링', /밀링/],
      ['연삭기', /연삭/],
      ['드릴·보루방', /드릴|보루방|텝|탭/],
      ['프레스·기타', /./]
    ];
    // 보통 가격대(하위 25%~상위 25%): analysis/price_by_type.json (2026.10.27, 가격 공개 매물 기준)
    const BAND = { '머시닝센터': [20400000, 55000000], '선반': [3000000, 12000000], '밀링': [3500000, 9500000] };
    const all = this.data().map(m => ({ ...m, kind: KIND.find(([, re]) => re.test(m.title))[0] }));
    const groups = { '전체': all, '직영 매물': all.filter(m => m.own), '다른 판매자': all.filter(m => !m.own) };
    const byTab = groups[this.state.tab];
    const shown = this.state.kind === '전체' ? byTab : byTab.filter(m => m.kind === this.state.kind);
    const won = (n) => (n / 10000).toLocaleString('ko-KR') + '만 원';
    const cmp = (m) => {
      const band = BAND[m.kind];
      const p = m.price === '가격 협의' ? null : Number(m.price.replace(/[^0-9]/g, '')) * 10000;
      if (!band || !p) return { hasCmp: false };
      const range = `${m.kind} 보통 ${won(band[0])}~${won(band[1])}`;
      if (p < band[0]) return { hasCmp: true, cmp: `보통 가격대보다 낮은 편 · ${range}`, cmpBg: '#DDF0E4', cmpFg: '#14532D' };
      if (p > band[1]) return { hasCmp: true, cmp: `큰 기계·옵션 확인 · ${range}`, cmpBg: '#FFF4E5', cmpFg: '#8A4B00' };
      return { hasCmp: true, cmp: `보통 가격대 안 · ${range}`, cmpBg: '#EEF2F8', cmpFg: '#12263F' };
    };
    return {
      fs: large ? Math.round(base * 1.25) : base,
      isNormal: String(!large), isLarge: String(large),
      normalBg: large ? off.bg : on.bg, normalFg: large ? off.fg : on.fg,
      largeBg: large ? on.bg : off.bg, largeFg: large ? on.fg : off.fg,
      setNormal: () => this.setState({ large: false }),
      setLarge: () => this.setState({ large: true }),
      tabs: Object.keys(groups).map(t => {
        const active = this.state.tab === t;
        return { label: t, count: groups[t].length, on: String(active), bg: active ? '#12263F' : '#FFFFFF', fg: active ? '#FFFFFF' : '#12263F', pick: () => this.setState({ tab: t }) };
      }),
      kinds: ['전체', ...KIND.map(k => k[0])].map(k => {
        const n = k === '전체' ? byTab.length : byTab.filter(m => m.kind === k).length;
        const active = this.state.kind === k;
        return { label: k, count: n, on: String(active), bg: active ? '#FFF4E5' : '#FFFFFF', border: active ? '#B8430F' : '#DAD7CF', weight: active ? 700 : 500, pick: () => this.setState({ kind: k }) };
      }),
      summary: shown.length ? `매물 ${shown.length}건을 보고 계십니다.` : '이 조건의 매물이 없습니다. 위에서 다른 종류를 눌러 보세요.',
      items: shown.map(m => ({ ...m, ...cmp(m), border: m.own ? '#B8430F' : '#DAD7CF', priceFg: m.price === '가격 협의' ? '#545B66' : '#14171C' }))
    };
  }
}

window.Component = Component;</script>

<div id="dc-root"></div>
