  renderVals() {
    const base = this.props.baseSize ?? 18;
    const large = this.state.large;
    const on = { bg: '#FFFFFF', fg: '#12263F' };
    const off = { bg: 'transparent', fg: '#FFFFFF' };
    const TAG = {
      '시황': ['#12263F', '#FFFFFF'], '현장 이야기': ['#B8430F', '#FFFFFF'], '질문': ['#E3ECFA', '#0F2F7A'],
      '수출': ['#DDF0E4', '#14532D'], '사진': ['#EEE', '#3D434C']
    };
    const all = this.posts().map((p, i) => ({ ...p, i }));
    const tabNames = ['전체', '시황', '현장 이야기', '질문', '수출', '사진'];
    const shown = this.state.tab === '전체' ? all : all.filter(p => p.tag === this.state.tab);
    const sel = shown.find(p => p.i === this.state.sel) || shown[0] || all[0];
    const IMGS = {
      hero: ['img/hero.jpg', '공장 전경'],
      cnc: ['img/cnc_lathe.jpg', 'CNC 선반'],
      mct: ['img/mct.jpg', '머시닝센터'],
      lathe: ['img/manual_lathe.jpg', '범용 선반'],
      mill: ['img/milling.jpg', '범용 밀링'],
      brake: ['img/press_brake.jpg', '절곡기'],
      grind: ['img/grinder.jpg', '연삭기']
    };
    const GAL = [
      ['mct', 'cnc', 'lathe', 'mill'],
      ['lathe', 'mill', 'mct'],
      ['hero', 'lathe', 'brake'],
      ['lathe', 'hero'],
      ['mill', 'hero', 'grind'],
      ['cnc', 'mct'],
      ['brake', 'grind', 'mill']
    ];
    const deco = (p) => ({
      ...p,
      gallery: (GAL[p.i] || []).map(k => ({ img: IMGS[k][0], alt: IMGS[k][1] + ' 사진', cap: IMGS[k][1] })),
      tagBg: TAG[p.tag][0], tagFg: TAG[p.tag][1],
      kindFg: p.kind === '화면 예시' || p.kind.includes('초안') ? '#8A5A00' : '#3D434C',
      ccount: p.comments.length
    });
    return {
      fs: large ? Math.round(base * 1.25) : base,
      isNormal: String(!large), isLarge: String(large),
      normalBg: large ? off.bg : on.bg, normalFg: large ? off.fg : on.fg,
      largeBg: large ? on.bg : off.bg, largeFg: large ? on.fg : off.fg,
      setNormal: () => this.setState({ large: false }),
      setLarge: () => this.setState({ large: true }),
      tabs: tabNames.map(t => {
        const n = t === '전체' ? all.length : all.filter(p => p.tag === t).length;
        const active = this.state.tab === t;
        return { label: t, count: n, on: String(active), bg: active ? '#12263F' : '#FFFFFF', fg: active ? '#FFFFFF' : '#12263F', pick: () => this.setState({ tab: t }) };
      }),
      list: shown.map(p => ({
        ...deco(p),
        cur: String(p.i === sel.i), border: p.i === sel.i ? '#12263F' : '#DAD7CF',
        open: () => this.setState({ sel: p.i })
      })),
      cur: deco(sel)
    };
  }
