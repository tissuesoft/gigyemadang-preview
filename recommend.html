            why: ['큰 부품은 탭핑센터 테이블에 올라가지 않아 머시닝센터가 맞아요.', '구멍·탭을 자동으로 반복 가공해요.'],
            check: ['테이블 크기와 적재 무게', '자동 공구 교환(ATC) 동작', '각 축 이송 유격'] }
        : { type: '탭핑센터', name: '탭핑센터', spec: '구멍·탭 전용 고속 기계',
            why: ['구멍과 나사산을 빠르게 반복 가공해요.', '공구 교환이 빨라 수량이 많을수록 이득이에요.'],
            check: ['주축 회전과 탭 동기 동작', '공구 매거진 상태', '테이블 이송 유격'] };
    } else {
      r = { type: '평면 연삭기', name: a.size === 's' ? '평면 연삭기 (소형)' : '평면 연삭기', spec: big ? '테이블이 긴 대형 평면 연삭기' : '소·중형 평면 연삭기',
        why: ['선반·밀링으로 깎은 뒤 표면과 치수를 정밀하게 마무리해요.', '금형·지그 정밀 부품에 꼭 필요해요.', '둥근 부품의 바깥지름을 가는 일이라면 원통 연삭기가 맞아요.'],
        check: ['숫돌 축 소음과 떨림', '테이블 미끄럼면 상태', '마그네틱 척 흡착력'] };
    }
    // 가격대: 국내 매물 희망가격 분포(가격이 적힌 매물 기준). 대형은 상위 25% 쪽으로 본다.
    const PRICE_DATE = '2026.10.27';
    const p = this.priceTable()[r.type];
    const man = (x) => Math.round(x / 10000).toLocaleString('ko-KR') + '만 원';
    r.count = p ? p.n.toLocaleString('ko-KR') + '건' : '-';
    if (p && p.priced >= 15) {
      r.range = '약 ' + man(p.p25) + ' ~ ' + man(p.p75);
      r.rangeNote = '가운데 값 ' + man(p.med) + ' · 가격이 적힌 매물 ' + p.priced + '건 기준 (' + PRICE_DATE + ' 수집)';
    } else {
      r.range = '상담으로 확인';
      r.rangeNote = '가격을 공개한 매물이 적어요' + (p ? ' (' + p.priced + '건)' : '') + '. 전화로 물어보시면 바로 알려드려요.';
    }
    const cap = { 1: 10000000, 2: 30000000, 3: 60000000, 4: Infinity }[a.budget];
    const ref = p && p.priced >= 15 ? (big ? p.p75 : p.med) : null;
    r.budgetNote = ref && cap < (big ? ref : p.p25)
      ? '고르신 예산은 이 기계 매물 대부분보다 낮아요. 연식이 오래된 기계 위주로 찾게 되니, 시운전을 꼭 보고 사세요.'
      : ref && cap < ref
      ? '고르신 예산이면 중간 가격보다 아래쪽 매물에서 찾게 돼요. 상태 점검을 꼼꼼히 하세요.'
      : '';
    return r;
  }
  renderVals() {
    const qs = this.questions();
    const { step, a } = this.state;
    const done = step >= qs.length;
    const q = done ? qs[qs.length - 1] : qs[step];
    const pick = (key, v) => () => this.setState({ a: { ...a, [key]: v }, step: step + 1 });
    const summary = qs.map((x) => {
      const o = x.options.find((o) => o.v === a[x.key]);
      return x.title.replace('?', '') + ' → ' + (o ? o.label : '-');
    });
    return {
      asking: !done, done,
      stepNo: Math.min(step + 1, qs.length),
      stepLabel: (Math.min(step + 1, qs.length)) + ' / ' + qs.length,
      progress: Math.round((Math.min(step + 1, qs.length) / qs.length) * 100) + '%',
      q: { title: q.title, help: q.help, options: q.options.map((o) => ({ ...o, pick: pick(q.key, o.v) })) },
      canBack: step > 0 && !done,
      back: () => this.setState({ step: Math.max(0, step - 1) }),
      restart: () => this.setState({ step: 0, a: {} }),
      rec: done ? this.recommend(a) : { name: '', spec: '', why: [], check: [], budgetNote: '', range: '', rangeNote: '', count: '' },
      summary
    };
  }
}

window.Component = Component;</script>
